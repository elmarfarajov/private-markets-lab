name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "ruff==0.16.8"
      - run: ruff check src tests
      - run: ruff format --check src tests
      - name: Strict typing
        run: |
          pip install -e ".[dev]"
          mypy

  test:
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Tests (the market charts are skipped without the local history)
        run: pytest -q --cov=pmlab --cov-report=term-missing
      - name: Validation suite
        run: pmlab validate --fast

  package:
    # the wheel on its own, without the development extras
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - name: Install the wheel alone and run it
        run: |
          python -m venv /tmp/wheel
          /tmp/wheel/bin/pip install dist/*.whl
          cd /tmp
          printf 'date,amount\n2020-01-01,-1600\n2021-01-01,10000\n2022-01-01,-10000\n' > pump.csv
          /tmp/wheel/bin/pmlab irr pump.csv
          /tmp/wheel/bin/python -c "import pathlib, pmlab; assert (pathlib.Path(pmlab.__file__).parent / 'py.typed').exists()"
