[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pmlab"
version = "0.2.0"
description = "Private markets and alternative investments: fund cash flows, fees, models, risk and allocation, each measure held to an independent reference."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Elmar Farajov" }]
keywords = ["private equity", "private markets", "PME", "IRR", "alternative investments", "endowment"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Topic :: Office/Business :: Financial :: Investment",
    "Intended Audience :: Science/Research",
    "Typing :: Typed",
]
dependencies = ["numpy>=2.0", "scipy>=1.13", "pandas>=2.2.2", "matplotlib>=3.9", "yfinance>=0.2.54"]

[project.urls]
Repository = "https://github.com/elmarfarajov/private-markets-lab"
Changelog = "https://github.com/elmarfarajov/private-markets-lab/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff==0.16.8", "mypy>=1.10", "hypothesis>=6.100", "mpmath>=1.3", "numpy-financial>=1.0", "build>=1.2", "twine>=5.0"]

[project.scripts]
pmlab = "pmlab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pmlab = ["py.typed"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 130
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY"]
ignore = ["E731"]

[tool.ruff.lint.per-file-ignores]
# chart captions are prose; breaking them mid-sentence hurts more than it helps
"src/pmlab/gallery/fees.py" = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/pmlab"]

[[tool.mypy.overrides]]
module = ["scipy.*", "mpmath.*", "pandas.*", "yfinance.*", "numpy_financial.*"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["pmlab"]
omit = ["*/__main__.py"]
